  (function () {
    const root = document.documentElement;
    try { const saved = localStorage.getItem('iekb-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
    document.getElementById('btnTheme').addEventListener('click', () => {
      const dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && !matchMedia('(prefers-color-scheme: light)').matches);
      const next = dark ? 'light' : 'dark'; root.setAttribute('data-theme', next);
      try { localStorage.setItem('iekb-theme', next); } catch (e) {}
    });
  })();
</script>
</body>
